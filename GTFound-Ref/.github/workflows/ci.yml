name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Install PLINK 1.9
        run: |
          sudo apt-get update
          sudo apt-get install -y plink1.9
      - name: Test public interfaces
        env:
          PLINK_BIN: plink1.9
        run: python -m pytest -q
      - name: Check CLI entry points
        run: |
          gtfound --help
          python -m gtfound --help
          bash -n examples/run_vcf_pipeline.sh
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-py${{ matrix.python-version }}
          path: dist/*
